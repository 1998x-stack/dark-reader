name: Userscript verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-browser-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: |
          node --check safari-dark-reader.user.js
          python -m compileall -q tests
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Browser contract tests (WebKit is required)
        env:
          REQUIRE_WEBKIT: '1'
        run: python -m unittest discover -s tests -p 'test_userscript.py' -v
      - name: Download pinned real Dark Reader runtime
        run: |
          curl -fLSs --retry 3 --max-time 45 \
            https://cdn.jsdelivr.net/npm/darkreader@4.9.135/darkreader.js \
            -o /tmp/darkreader-4.9.135.js
          test -s /tmp/darkreader-4.9.135.js
          node --check /tmp/darkreader-4.9.135.js
      - name: Real-engine light-page darkening (Chromium + WebKit)
        env:
          DARKREADER_LIBRARY_PATH: /tmp/darkreader-4.9.135.js
          REQUIRE_WEBKIT: '1'
        run: python -m unittest discover -s tests -p 'test_real_engine.py' -v
